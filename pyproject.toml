[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "eeg-decoding"
version = "0.1.0"
description = "Subject-independent ZuCo EEG-to-sentence retrieval"
requires-python = ">=3.11,<3.14"
dynamic = ["dependencies"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "nbformat>=5,<6", "ipykernel>=6,<8"]
text = ["sentence-transformers>=3.4,<4", "transformers>=4.48,<5"]
labram = ["timm==0.9.16", "einops>=0.8,<0.9"]
[project.scripts]
eeg = "eeg_decoding.cli:main"
[tool.setuptools.dynamic]
dependencies = {file = "requirements.txt"}
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
